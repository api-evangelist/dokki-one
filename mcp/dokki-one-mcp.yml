crosswalk: mcp/dokki-one-tool-crosswalk.yml
mcp_apps_outbound: >-
  The reverse direction also exists: Dokki Copilot and agents call external MCP servers ("MCP Apps",
  Composio Tool Router) and each installed agent can carry its own MCP servers
  (POST/GET/PATCH/DELETE /api/v1/agents/{agent_id}/mcp in the REST reference).
