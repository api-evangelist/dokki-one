summary: 'Dokki ships two hosted MCP surfaces over the same data core as its REST API: the /mcp/v2 facade (8 action-routed
  tools + preview_resource) and the legacy flat /api/mcp server (~37 tools, names not published). Both answer tools/list
  with 401 anonymously, so this crosswalk binds by the ACTION VOCABULARY the provider documents for each facade
  tool (find/read/create/edit/share/message/publish/connect) to the REST operations that cover the same nouns. The
  REST document is itself generated from the reference (no request/response schemas), so no tool inherits a full
  inputSchema here; confidence is medium at best and low where the facade action has no visible REST twin.'
surfaces:
  openapi:
    file: openapi/dokki-one-openapi.yml
    operations: 158
    origin: generated from documentation; provider publishes no OpenAPI
  mcp:
  - endpoint: https://dokki.one/mcp/v2
    tools_list: gated (HTTP 401, JSON-RPC -32001 Unauthorized; WWW-Authenticate resource_metadata points at /.well-known/oauth-protected-resource)
    tool_count: 9
  - endpoint: https://dokki.one/api/mcp
    tools_list: gated (HTTP 401)
    tool_count: ~37 (provider-stated, names unpublished)
  - endpoint: https://dokki.one/api/publish-mcp
    note: Publish workspace-connector flavor (connector URL only)
  - endpoint: https://dokki.one/api/mem-mcp
    note: Memory workspace-connector flavor (connector URL only)
  graphql: null
