note: >-
  Dokki publishes NO client SDKs for its REST API on any package registry: npm, PyPI, RubyGems,
  crates.io, Packagist and NuGet were searched on 2026-09-19 (the only npm package named `dokki` is an
  unrelated 0.1.0 from 2020 by a different author). What the company does ship, all from the Dokki-lab
  GitHub organization, is agent-side tooling: a Claude Code plugin and a Codex plugin that wire the
  hosted MCP facade plus skills, two open-source Agent Skill packages (slides, charts) installed with
  the `skills` CLI or a Claude Code marketplace, the official docs mirror, and a signed macOS desktop
  app distributed as a direct download with published SHA-256 checksums. None of these is an API
  client library, so no SDKs pointer is emitted. Versions come from each repository's manifest and
  the GitHub releases/commits API; the GitHub org has no npm/PyPI presence to read a registry date from.
