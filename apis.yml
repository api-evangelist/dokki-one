- aid: dokki-one:dokki-mcp-server
  name: Dokki MCP Server
  description: Hosted remote MCP over stateless Streamable HTTP. The canonical /mcp/v2 facade exposes eight action-routed
    tools — find, read, create, edit, share, message, publish, connect (1000+ external integrations via Composio) — plus preview_resource
    (MCP Apps UI); the legacy /api/mcp server exposes ~37 flat tools, and workspace connectors reuse the same servers plus
    /api/publish-mcp and /api/mem-mcp locked to one workspace. Authenticated by OAuth discovery (RFC 9728 -> RFC 8414 -> dynamic
    client registration on Dokki's Supabase Auth tenant), a dk_ API key, or a connector token; anonymous tools/list returns
    401.
  humanURL: https://dokki.one/pub/docs/clients
  baseURL: https://dokki.one/mcp/v2
