x-notes:
  identity: The harvest stub was named "Brad" (the a2aregistry.org author field — Brad Bao, who also publishes personal sites
    on dokki.one). The company is Dokki, operated by UEVNS PTE. LTD. (Privacy Policy). Slug dokki-one follows the domain.
  a2a: 'No AgentCard artifact: /.well-known/agent-card.json and /.well-known/agent.json 404 on dokki.one and every subdomain.
    The registry listing points at https://openagora.cc/agents/a9e94bd1-8cc1-41b0-8083-ecb0b938f2b0/agent-card.json — openagora.cc
    is a third-party A2A registry (GitHub Noxr3/openagora, og:url agora.naxlab.xyz), and the card fetch timed out twice on
    2026-09-19. A registry-hosted card is not the provider serving one, so nothing was saved.'
  openapi: 'Generated from the published HTML reference (x-generated-from: documentation): paths, methods, required scopes
    and path params are verbatim; request/response schemas are absent because Dokki publishes none. Kept because the provider
    names GET /api/v1/capabilities (authenticated) as the live contract and offers no spec download.'
  not_emitted: SDKs (no client libraries), Idempotency (coverage none), StatusPage/Deprecation (none exist), Security/Compliance/TrustCenter
    (no VDP, certs or trust page), Sandbox, CLI (skill CLIs only), Webhooks/AsyncAPI (no outbound event surface documented),
    AgentCard (see a2a).
  regulatory: 'regulatory/dokki-one-regulatory-posture.yml records the horizontal-regime harvest (two signals found: DataSubjectRequest,
    ExitAssistance; twelve searched and absent). The schema has no pointer type for the artifact itself, so it is reached
    from here.'
  brand_and_download: 'Brand assets manifest: https://dokki.one/api/brand-assets (JSON); desktop app: https://dokki.one/download
    (see packages/). Not wired as pointers because the schema defines no canonical type for either.'
