aid: dokki-one
name: Dokki
description: Dokki (UEVNS PTE. LTD., Singapore) is an agent-native collaboration workspace where people and AI agents share
  the same documents, tables, artifacts, chat and permissions. It exposes a 158-operation REST API under https://dokki.one/api/v1
  (documented across ~200 public reference pages, no OpenAPI published — the one in this repo is generated from that reference),
  hosted remote MCP servers — the /mcp/v2 facade of eight action-routed tools plus preview_resource, and a legacy flat /api/mcp
  server — with OAuth 2.0 / OIDC discovery (RFC 8414, RFC 9728, dynamic client registration) served from its own .well-known,
  ten provider-published Agent Skills across Claude Code and Codex plugins, a public llms.txt, and a macOS desktop app. Formerly
  stubbed as "Brad" from an a2aregistry.org listing whose card is hosted on the third-party registry openagora.cc, not on
  a Dokki host.
