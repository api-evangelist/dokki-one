- aid: dokki-one:dokki-api
  name: Dokki API
  description: 'REST API to the same resources and permissions the Dokki app uses: workspaces and the resource tree (documents,
    tables, artifacts, folders, files), content and snapshots, keyword/semantic/hybrid search, agents, runs, approvals, schedules,
    memories and automations, organizations and members, comments, sharing and permissions, IM conversations and chat sessions,
    publishing and custom domains, imports, forms, tags, trash, API keys, usage, credits, storage and models. 158 operations
    across 83 paths, bearer-authenticated (dk_ API keys with resource:action scopes), with GET /api/v1/capabilities as the
    live endpoint catalog.'
