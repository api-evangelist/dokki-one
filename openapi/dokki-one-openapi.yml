openapi: 3.1.0
info:
  title: Dokki API
  version: v1
  summary: 'The programmatic interface to Dokki workspaces: documents, tables, artifacts, files, search, agents,
    automations, organizations, publishing and account endpoints under https://dokki.one/api/v1.'
  description: |-
    Dokki (UEVNS PTE. LTD., Singapore) is an agent-native collaboration workspace. This document was GENERATED by API Evangelist from the provider's published API reference at https://dokki.one/pub/api (197 pages fetched 2026-09-19); Dokki publishes no machine-readable contract of its own and states that GET /api/v1/capabilities (authenticated) is the live source of truth for the exposed endpoint catalog.

    FIDELITY: every path, method, required scope and path parameter is transcribed verbatim from its reference page (each operation's externalDocs points at that page). Request-body fields are included only where the reference documents them; the remaining bodies are open objects because the reference says only "Send a JSON request body with only supported fields". Response schemas are limited to the documented envelope ({data, request_id} on success; {error: {code, message, request_id}} on failure) — Dokki does not publish per-endpoint response shapes. Tags are API Evangelist's grouping by the reference's navigation sections. Nothing here was invented; where the reference is silent, this document is silent.
  contact:
    name: Dokki support
    email: support@dokki.one
    url: https://dokki.one/pub/docs/faq
  termsOfService: https://dokki.one/terms
  x-generated-from: documentation
  x-generated-by: API Evangelist enrichment pipeline
  x-generated: '2026-09-19'
  x-source: https://dokki.one/pub/api
  x-provider: dokki-one
externalDocs:
  description: Dokki API documentation
  url: https://dokki.one/pub/api
servers:
- url: https://dokki.one/api/v1
  description: Production. "All public endpoints use https://dokki.one/api/v1" (https://dokki.one/pub/api/api-conventions);
    the reference pages state Base URL https://dokki.one with every path prefixed /api/v1, which this document folds
    into the server URL.
security:
- BearerAuth: []
tags:
- name: Core
  description: Identity, capability discovery, API keys, notifications and workspace templates.
- name: Resources
  description: 'Workspaces and the resource tree: documents, tables, artifacts, folders, files, content, snapshots,
    tags, trash, imports, connectors and forms.'
- name: Search
  description: Keyword, semantic and hybrid search.
- name: Agents
  description: Agents, runs, approvals, schedules, memories, automations and work items.
- name: Collaboration
  description: Members, comments, permissions, access requests, pins, IM conversations and chat sessions.
- name: Organizations
  description: Organizations and org membership.
- name: Publishing
  description: Publishing workspaces and resources to public sites.
- name: Account
  description: Usage, credits, storage and model availability.
