    patch:
      operationId: updateResource
      summary: Update a resource's identity, metadata, visibility, or position
      tags:
      - Resources
      description: The caller needs current write access to the resource. Moving beneath a parent also requires write access to that parent. metadata replaces the existing metadata object, so send every key you intend to retain. is_private and public_access require resource manage access.
      externalDocs:
        url: https://dokki.one/pub/api/update-resource-id
      x-required-scope: resource:write
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Path identifier.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Non-empty string.
                icon:
                  type:
                  - string
                  - 'null'
                  description: An emoji or a lucide:<name> value.
                metadata:
                  description: JSON value stored as the resource metadata; replaces the existing object.
                parent_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Parent resource UUID, or null for the workspace root.
                insert_after_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Sibling UUID, or null to place the resource first.
                is_private:
                  type: boolean
                  description: Requires resource manage access; true clears public access.
                public_access:
                  type:
                  - string
                  - 'null'
                  enum:
                  - null
                  - view
                  - comment
                  - edit
                  description: Requires resource manage access; a non-null value makes the resource non-private and applies to its subtree.
      responses:
