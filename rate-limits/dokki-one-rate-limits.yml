summary: >-
  Dokki documents that rate limiting exists and how to behave under it, but publishes NO numeric
  limits, windows or rate-limit response headers. The only runtime signal is the 429 status code with
  the standard error envelope. Plan quotas (e.g. 5 AI messages/day on Free, "5x Pro's monthly AI
  quota" on Max) are AI-usage entitlements metered in credits, not API request limits, and are
  recorded in plans/dokki-one-plans-pricing.yml.
