guidance_published:
- Respect 429 responses and keep concurrency bounded per key, Org, and workspace.
- Batch read operations, cache immutable metadata, and avoid polling faster than necessary.
- Retry 408/429/5xx with exponential backoff and jitter; do not retry 400/401/403/404/422 unchanged.
