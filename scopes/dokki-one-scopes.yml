oauth_scopes:
  authorization_server: https://dokki.one (metadata at /.well-known/oauth-authorization-server; endpoints on Dokki's
    Supabase Auth tenant)
  scopes_supported:
  - openid
  - profile
  - email
  - phone
  - offline_access
  protected_resource_scopes_supported:
  - openid
  - email
  - profile
  grant_types_supported:
  - authorization_code
  - refresh_token
  code_challenge_methods_supported:
  - S256
  - plain
  registration_endpoint: https://schcrwqbgkcmhdltwgcz.supabase.co/auth/v1/oauth/clients/register
  consent_model: Personal / Organization / Workspace selection on the consent screen; reconnect to change the grant
    — "Do not assume that passing a different workspace_id can expand an existing grant."
integration_patterns_from_docs:
  read_only_indexer:
  - workspace:read
  - resource:read
  - content:read
  - search:read
  content_synchronizer:
  - workspace:read
  - resource:read
  - content:read
  - search:read
  - content:write
  ai_agent: start with read scopes, add one write scope at a time, require approval for publishing, sharing, deletion
    or billing
