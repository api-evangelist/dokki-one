summary: 'Dokki has TWO scope vocabularies. (1) API-key scopes of the form resource:action (read / write / submit)
  that gate every /api/v1 endpoint — a tenant-bound Dokki API key carries a list of them, new keys default to read
  scopes, and GET /api/v1/me reports the caller''s effective set. These are NOT OAuth scopes: they are attached
  to dk_ keys at creation (POST /api/v1/api-keys). (2) The OAuth/OIDC scopes served by the RFC 8414 / OIDC discovery
  documents for MCP clients — the five standard OIDC scopes only; authorization breadth for MCP is chosen on the
  consent screen (Personal / Organizations / Workspaces), not by scope string. derive-oauth-scopes.py correctly
  reports no oauth2 scheme in the generated OpenAPI; this file was written from the docs and the live metadata.'
